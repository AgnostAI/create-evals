name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: mkdir -p test/fixtures/mini/node_modules && ln -sfn ../../../.. test/fixtures/mini/node_modules/create-evals
      - run: npm test
      - run: npm pack --dry-run
