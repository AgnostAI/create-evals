<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book time with {{OWNER_NAME}}</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --me: #1c1917; --me-fg: #fafaf9; --them: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --line: #292524; --me: #f5f5f4; --me-fg: #0c0a09; --them: #1c1917; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; padding: 0 16px; }
  header { padding: 28px 0 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 20px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  #log { flex: 1; overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .assistant { align-self: flex-start; background: var(--them); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .user { align-self: flex-end; background: var(--me); color: var(--me-fg); border-bottom-right-radius: 4px; }
  .error { align-self: center; color: #dc2626; font-size: 14px; }
  .typing { color: var(--muted); }
  .msg a { color: inherit; }
  form { display: flex; gap: 8px; padding: 12px 0 24px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; font: inherit; color: inherit; background: var(--them); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; max-height: 160px; }
  textarea:focus { outline: 2px solid var(--fg); outline-offset: -1px; }
  button { font: inherit; font-weight: 500; border: 0; border-radius: 12px; padding: 0 18px; background: var(--me); color: var(--me-fg); cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Book time with {{OWNER_NAME}}</h1>
    <p>Tell the assistant what you'd like to talk about. It finds a time that works and sends you a calendar invite.</p>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Hi, I'd like 30 minutes to talk about…" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</main>
<script>
  const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const messages = [];
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  // Render text with clickable links, without ever treating it as HTML.
  function bubble(cls, text) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    for (const part of text.split(/(https?:\/\/[^\s)]+)/g)) {
      if (/^https?:\/\//.test(part)) {
        const a = document.createElement("a");
        a.href = part; a.textContent = part; a.target = "_blank"; a.rel = "noopener";
        el.append(a);
      } else el.append(part);
    }
    log.append(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  bubble("assistant", "Hi! I can book a meeting with {{OWNER_NAME}}. What would you like to talk about?");

  input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = ""; input.style.height = "auto";
    messages.push({ role: "user", content: text });
    bubble("user", text);
    const typing = bubble("assistant typing", "…");
    send.disabled = true;
    try {
      const res = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ messages, timeZone }) });
      const body = await res.json();
      typing.remove();
      if (!res.ok) throw new Error(body.error || "Something went wrong.");
      messages.push({ role: "assistant", content: body.reply });
      bubble("assistant", body.reply);
    } catch (err) {
      typing.remove();
      messages.pop();
      input.value = text;
      bubble("error", err.message);
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
